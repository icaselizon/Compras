# Publica la app gratis en GitHub Pages (con HTTPS) y actualiza los precios todos los días.
name: Publicar Canasta

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'   # 5:17 a. m. hora de Costa Rica
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar precios
        run: node scripts/sync.js
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
